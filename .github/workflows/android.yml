name: Build PosePilot Android

on:
  workflow_dispatch:
  push:
    branches: [ main, ai-photographer-2 ]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: PosePilot_RC1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Test
        run: flutter test

      - name: Build PosePilot APK
        run: flutter build apk --debug

      - name: Upload PosePilot APK
        uses: actions/upload-artifact@v4
        with:
          name: PosePilot-Android
          path: PosePilot_RC1/build/app/outputs/flutter-apk/app-debug.apk
